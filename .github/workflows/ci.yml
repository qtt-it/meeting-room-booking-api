name: Backend CI
on:
  pull_request:
  push:
    branches: [main, develop, "feature/**", "chore/**", "docs/**"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: meeting_booking_test
          POSTGRES_USER: meeting_test
          POSTGRES_PASSWORD: test_database_password
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U meeting_test -d meeting_booking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify formatting, unit tests, integration tests and packaging
        run: ./mvnw -B -ntp verify -Pintegration
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start the complete stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Check health, auth and rooms
        run: bash tools/smoke.sh
      - name: Run the complete API collection against the disposable stack
        working-directory: tools/bruno
        run: |
          mkdir -p ../../.local
          npx --yes @usebruno/cli@4.3.0 run --env Local --bail --reporter-junit ../../.local/bruno.xml --reporter-skip-all-headers --reporter-skip-body
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Retain API collection report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-collection-report
          path: .local/bruno.xml
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down
