name: meeting-room-booking
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-meeting_booking}
      POSTGRES_USER: ${DATABASE_USERNAME:-meeting}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local_database_password}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: meeting-room-booking-api:local
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-meeting_booking}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-meeting}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local_database_password}
      JWT_SECRET: ${JWT_SECRET:-local-development-key-replace-before-any-deployment-2026}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-LocalDemo!2026ChangeMe}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 35s
    restart: unless-stopped
volumes:
  postgres_data:
